<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- 業務自助預約頁（2026-10-01 新增）。業務透過 LINE 收到的連結打開這頁，
     不用登入、不會看到完整主控台，只處理「這一個任務」的時段預約。
     跟 index.html 共用同一個後端 API_BASE，獨立成一個檔案是因為這是完全
     不同的使用情境（外部/免登入、單一任務、手機為主），硬塞進主控台的
     側邊欄架構反而會讓業務多看到一堆跟他無關的東西。 -->
<title>現場時段預約</title>
<style>
  :root{
    --bg:#F7F3EC; --surface:#FFFFFF; --text:#1B2333; --text-muted:#6B7280;
    --border:#E4E8F1; --success:#16A34A; --success-soft:#E7F7EE; --danger:#D64545; --danger-soft:#FDECEC;
    --sun-1:#FFB648; --sun-2:#F2790C; --sun-3:#C4530A;
    --shadow-card:0 2px 10px rgba(30,40,70,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(255,182,72,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 100%, rgba(242,121,12,.07), transparent 55%),
      var(--bg);
    color:var(--text);
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand-mark{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,var(--sun-1),var(--sun-2) 65%,var(--sun-3));
    box-shadow:0 5px 14px rgba(196,83,10,.35);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  }
  .brand-name{font-weight:700;font-size:14.5px;}
  .brand-sub{font-size:11px;color:var(--text-muted);}
  .card{
    background:#FFFCF5;border:1px solid #F0E4CC;border-radius:16px;padding:20px;
    box-shadow:var(--shadow-card);margin-bottom:16px;
  }
  .hint{font-size:12px;color:var(--text-muted);line-height:1.7;padding:12px 14px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;}
  .info-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;}
  .info-label{color:var(--text-muted);width:64px;flex-shrink:0;}
  .pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#E8EEFF;color:#1E46C4;}
  label{font-size:12.5px;font-weight:600;display:block;margin:14px 0 6px;}
  select, input[type="text"], textarea{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;
    font-size:15px;font-family:inherit;color:var(--text);background:var(--surface);
  }
  textarea{resize:vertical;}
  .date-options{display:flex;flex-wrap:wrap;gap:8px;}
  .date-btn{
    padding:10px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);
    font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
  }
  .date-btn.active{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .btn-submit{
    width:100%;margin-top:20px;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-submit:disabled{opacity:.6;cursor:not-allowed;}
  .error-box{display:none;background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-top:14px;line-height:1.6;}
  .success-box{text-align:center;padding:30px 10px;}
  .success-icon{font-size:48px;margin-bottom:10px;}
  .success-title{font-size:17px;font-weight:700;margin-bottom:6px;}
  .success-detail{font-size:13.5px;color:var(--text-muted);line-height:1.8;}
  .loading, .not-found{text-align:center;color:var(--text-muted);font-size:13px;padding:40px 10px;}
  select option:disabled{background:#E9E9EC;color:#9AA0AA;}
  .busy-hint{display:none;font-size:12px;line-height:1.7;color:#8A5A12;background:#FFF4DC;border-radius:10px;padding:8px 12px;margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">陽</div>
    <div>
      <div class="brand-name">陽光管理主控台</div>
      <div class="brand-sub">現場時段預約</div>
    </div>
  </div>
  <div id="app"><div class="loading">載入中…</div></div>
</div>

<script>
const API_BASE = 'https://epc-backend-4aj2.onrender.com';
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';

const TIME_OPTIONS = (() => {
  const list = [];
  for(let h = 7; h <= 20; h++){
    for(const m of [0, 30]){
      if(h === 20 && m === 30) continue;
      list.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
    }
  }
  return list;
})();
function timeOptionsHtml(){
  return '<option value="">請選擇</option>' + TIME_OPTIONS.map(t => `<option value="${t}">${t}</option>`).join('');
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${m}/${d}`;
}
function fmtWeekday(iso){
  const wdays = ['日','一','二','三','四','五','六'];
  const d = new Date(iso + 'T00:00:00');
  return '週' + wdays[d.getDay()];
}

let TASK = null;
let selectedDate = '';

async function init(){
  const app = document.getElementById('app');
  if(!TOKEN){
    app.innerHTML = '<div class="not-found">連結不完整，缺少 token，請跟窗口確認連結是否複製完整。</div>';
    return;
  }
  try{
    const res = await fetch(API_BASE + '/api/vendor-slots/public-task/' + encodeURIComponent(TOKEN), {cache:'no-store'});
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      app.innerHTML = '<div class="not-found">' + (data.error || '找不到這個任務，可能已經被刪除') + '</div>';
      return;
    }
    TASK = data.task;
    render();
  }catch(err){
    app.innerHTML = '<div class="not-found">載入失敗：' + err.message + '，請檢查網路連線後重新整理</div>';
  }
}

function render(){
  const app = document.getElementById('app');
  if(TASK.status === '已完成'){
    const b = TASK.booked || {};
    app.innerHTML = `
      <div class="card success-box">
        <div class="success-icon">✅</div>
        <div class="success-title">這個案子已經完成預約了</div>
        <div class="success-detail">
          ${TASK.vendor}　${TASK.case}${TASK.alias?('（'+TASK.alias+'）'):''}　${(TASK.type||[]).join('+')}<br>
          ${b.date ? (fmtDate(b.date) + '（' + fmtWeekday(b.date) + '）　' + b.start_time + '-' + b.end_time) : '（時間資訊讀取不到，請直接聯絡窗口確認）'}
          ${b.registrant ? ('<br>登記人：' + b.registrant) : ''}
        </div>
      </div>
      <div class="hint">如果時間需要調整，請直接聯絡窗口處理，這個連結已經不能再重新預約。</div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h1>${TASK.vendor}　${(TASK.type||[]).join('+')}</h1>
      <div class="sub">請跟屋主確認好時間後再送出，送出後這個時段就會鎖定、其他案件不能再卡進來</div>
      <div class="info-row"><span class="info-label">案號</span><span>${TASK.case}${TASK.alias?('　'+TASK.alias):''}</span></div>
      <div class="info-row"><span class="info-label">項目</span><span class="pill">${(TASK.type||[]).join('+')}</span></div>

      <label>選擇日期（廠商提供的候選日期）</label>
      <div class="date-options" id="dateOptions">
        ${TASK.candidate_dates.map(d => `<button type="button" class="date-btn" data-date="${d}" onclick="selectDate('${d}')">${fmtDate(d)}（${fmtWeekday(d)}）</button>`).join('')}
      </div>

      <div class="row2">
        <div>
          <label>開始時間</label>
          <select id="startTime" onchange="onStartTimeChange()">${timeOptionsHtml()}</select>
        </div>
        <div>
          <label>結束時間</label>
          <select id="endTime" onchange="refreshTimeOptions()">${timeOptionsHtml()}</select>
        </div>
      </div>
      <div class="busy-hint" id="busyHint"></div>
      <div class="sub" style="margin-top:6px;margin-bottom:16px;">⏱️ 選好開始時間後，結束時間會依預估作業時長自動帶入，仍可自行調整</div>

      <label>屋主聯絡資訊</label>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:12.5px;margin:-4px 0 8px;">
        <input type="checkbox" id="sameAsContract" onchange="onSameAsContractChange()">
        同公證書資訊
      </label>
      <div class="row2" style="margin-bottom:16px;">
        <div>
          <input type="text" id="ownerName" placeholder="屋主姓名">
        </div>
        <div>
          <input type="text" id="ownerPhone" placeholder="屋主電話">
        </div>
      </div>

      <label>您的姓名</label>
      <input type="text" id="registrant" value="${TASK.assignee || ''}" placeholder="例如：小夫">

      <label>備註（選填）</label>
      <textarea id="note" rows="2"></textarea>

      <div class="error-box" id="errorBox"></div>
      <button class="btn-submit" id="submitBtn" onclick="submitBooking()">完成預約</button>
    </div>
    <div class="hint">🔗 這個連結只能用一次，完成預約後就會失效，不用擔心被重複填寫。</div>`;
  applyTimeDurationDefault();
  refreshTimeOptions();
  // 只有一個候選日期的話直接幫業務選好，才看得到那天哪些時間已被預約
  if(TASK.candidate_dates.length === 1) selectDate(TASK.candidate_dates[0]);
}

// 2026-10-01 新增：各項目類型預設時間長度（分鐘），跟主控台「預約時段」
// modal 用同一套規則（掛表固定早上9點開始，其他類型只給時長，開始時間
// 預設也是9點，業務可以自己改）。開始時間空白時先補 09:00，再依時長算出
// 結束時間；業務改開始時間也會重算一次，但還是可以手動改掉。
// 2026-10-01 同日：項目類型改成可複選（任務可能同時是「植筋+放樣」），
// TASK.type 變成陣列，時長直接加總。
// 2026-10-01 再加一版：PM 在「指派給業務」建立任務時如果有給明確的預估
// 時長（勾「交由業務安排」直接填，或從完整預估時間換算），會存在
// TASK.duration_min，這裡優先用這個值；沒有的話（舊任務、或 PM 完全沒給
// 估計）才退回用項目類型算出的通用時長，確保這裡永遠有個合理預設可用。
const TYPE_DURATION_MIN = {'掛表':180,'植筋':180,'放樣':60,'場勘':60};
function getTaskDuration(){
  return TASK.duration_min || (TASK.type||[]).reduce((sum, t) => sum + (TYPE_DURATION_MIN[t] || 0), 0);
}
function applyTimeDurationDefault(){
  const duration = getTaskDuration();
  if(!duration) return;
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  if(!startSel || !endSel) return;
  if(!startSel.value){
    const def = [...startSel.options].find(o => o.value === '09:00');
    if(def && !def.disabled) startSel.value = '09:00'; else return;
  }
  const totalMin = toMin(startSel.value) + duration;
  const endVal = String(Math.floor(totalMin / 60)).padStart(2,'0') + ':' + String(totalMin % 60).padStart(2,'0');
  const endOpt = [...endSel.options].find(o => o.value === endVal);
  if(endOpt && !endOpt.disabled) endSel.value = endVal;
}

// 2026-10-03：這個廠商在選定日期「已經被預約」的時段，直接在開始/結束時間下拉
// 裡灰掉不能選（disabled），不用等按完成預約才被後端 409 擋下來。資料來自
// TASK.busy_slots（後端只給日期＋起訖時間，不帶別人的案號）。送出時後端仍
// 會再檢查一次衝突（兩個人同時開著頁面、其中一個先送出的情況還是會擋）。
function toMin(t){ const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function fmtMin(total){ return String(Math.floor(total / 60)).padStart(2,'0') + ':' + String(total % 60).padStart(2,'0'); }
function getBusyRanges(date){
  return ((TASK && TASK.busy_slots) || []).filter(b => b.date === date).map(b => [toMin(b.start_time), toMin(b.end_time)]);
}
function refreshTimeOptions(){
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  if(!startSel || !endSel) return;
  const busy = selectedDate ? getBusyRanges(selectedDate) : [];
  const startMin = startSel.value ? toMin(startSel.value) : null;
  [...startSel.options].forEach(o => {
    if(!o.value) return;
    const m = toMin(o.value);
    const blocked = busy.some(([s, e]) => m >= s && m < e);
    o.disabled = blocked;
    o.textContent = blocked ? o.value + '　已被預約' : o.value;
  });
  [...endSel.options].forEach(o => {
    if(!o.value) return;
    const m = toMin(o.value);
    const beforeStart = startMin !== null && m <= startMin;
    const overlaps = startMin !== null
      ? busy.some(([s, e]) => s < m && startMin < e)
      : busy.some(([s, e]) => m > s && m <= e);
    o.disabled = beforeStart || overlaps;
    o.textContent = (overlaps && !beforeStart) ? o.value + '　已被預約' : o.value;
  });
  [startSel, endSel].forEach(sel => {
    if(sel.value && sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = '';
  });
  const hint = document.getElementById('busyHint');
  if(hint){
    if(busy.length){
      hint.textContent = '📌 這個廠商這天已經有預約：' + busy.slice().sort((a, b) => a[0] - b[0]).map(([s, e]) => fmtMin(s) + '-' + fmtMin(e)).join('、') + '（灰色的時間不能選）';
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
  }
}
function onStartTimeChange(){
  refreshTimeOptions();
  applyTimeDurationDefault();
  refreshTimeOptions();
}

function selectDate(d){
  selectedDate = d;
  document.querySelectorAll('.date-btn').forEach(b => b.classList.toggle('active', b.dataset.date === d));
  // 換日期後，如果目前的開始時間（預設 09:00）剛好落在這天已被預約的時段、或
  // 預估時長排下去會撞到，就自動換成這天第一個排得下的開始時間。
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  const busy = getBusyRanges(d);
  const duration = getTaskDuration() || 30;
  const fits = s => s + duration <= 20 * 60 && !busy.some(([bs, be]) => s < be && bs < s + duration);
  const cur = startSel.value ? toMin(startSel.value) : null;
  if(cur === null || !fits(cur)){
    // 優先挑 09:00 以後（預設開始時間是 09:00，不要跳到一大早 07:00），
    // 09:00 以後都排不下才退回找更早的。
    const cand = TIME_OPTIONS.find(t => toMin(t) >= 9 * 60 && fits(toMin(t))) || TIME_OPTIONS.find(t => fits(toMin(t)));
    startSel.value = cand || '';
    endSel.value = '';
  }
  refreshTimeOptions();
  applyTimeDurationDefault();
  refreshTimeOptions();
}

// 2026-10-01 新增：「同公證書資訊」勾選後，把 PM 建立任務時已經查到的屋主
// 姓名/電話（來自租賃合約書，見 TASK.owner_name/owner_phone）直接帶進
// 輸入框，業務還是可以手動改（例如屋主換人、電話錯誤）。
function onSameAsContractChange(){
  if(!document.getElementById('sameAsContract').checked) return;
  document.getElementById('ownerName').value = TASK.owner_name || '';
  document.getElementById('ownerPhone').value = TASK.owner_phone || '';
}

async function submitBooking(){
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  const start_time = document.getElementById('startTime').value;
  const end_time = document.getElementById('endTime').value;
  const registrant = document.getElementById('registrant').value.trim();
  const owner_name = document.getElementById('ownerName').value.trim();
  const owner_phone = document.getElementById('ownerPhone').value.trim();
  const note = document.getElementById('note').value.trim();
  if(!selectedDate){ alert('請先選一個候選日期'); return; }
  if(!start_time || !end_time){ alert('請選開始/結束時間'); return; }
  if(!registrant){ alert('請填您的姓名'); return; }

  const btn = document.getElementById('submitBtn');
  const originalText = btn.textContent;
  btn.textContent = '送出中…'; btn.disabled = true;
  try{
    const res = await fetch(API_BASE + '/api/vendor-slots/public-task/' + encodeURIComponent(TOKEN) + '/book', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({date: selectedDate, start_time, end_time, registrant, note, owner_name, owner_phone}),
    });
    const data = await res.json().catch(()=>({}));
    if(res.status === 409 && data.conflict){
      const c = data.conflict;
      errorBox.innerHTML = `⚠️ 這個時段已經被佔用了：<b>${c.start_time}-${c.end_time}</b>　${(c.type||[]).join('+')}｜${c.case||''}${c.alias?('（'+c.alias+'）'):''}　登記人：${c.registrant||''}<br>請換一個時間再試一次。`;
      errorBox.style.display = 'block';
      // 頁面開著的期間別人剛好先預約了：把這段加進已被預約清單，下拉立刻灰掉
      TASK.busy_slots = (TASK.busy_slots || []).concat([{date: selectedDate, start_time: c.start_time, end_time: c.end_time}]);
      refreshTimeOptions();
      return;
    }
    if(!res.ok){
      errorBox.textContent = '⚠️ ' + (data.error || ('HTTP ' + res.status));
      errorBox.style.display = 'block';
      return;
    }
    TASK.status = '已完成';
    TASK.booked = {date: selectedDate, start_time, end_time, registrant};
    render();
  }catch(err){
    errorBox.textContent = '⚠️ 送出失敗：' + err.message;
    errorBox.style.display = 'block';
  }finally{
    btn.textContent = originalText; btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
