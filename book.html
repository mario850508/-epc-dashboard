<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- 業務自助預約頁（2026-10-01 新增）。業務透過 LINE 收到的連結打開這頁，
     不用登入、不會看到完整主控台，只處理「這一個任務」的時段預約。
     跟 index.html 共用同一個後端 API_BASE，獨立成一個檔案是因為這是完全
     不同的使用情境（外部/免登入、單一任務、手機為主），硬塞進主控台的
     側邊欄架構反而會讓業務多看到一堆跟他無關的東西。 -->
<title>現場時段預約</title>
<style>
  :root{
    --bg:#F7F3EC; --surface:#FFFFFF; --text:#1B2333; --text-muted:#6B7280;
    --border:#E4E8F1; --success:#16A34A; --success-soft:#E7F7EE; --danger:#D64545; --danger-soft:#FDECEC;
    --sun-1:#FFB648; --sun-2:#F2790C; --sun-3:#C4530A;
    --shadow-card:0 2px 10px rgba(30,40,70,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(255,182,72,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 100%, rgba(242,121,12,.07), transparent 55%),
      var(--bg);
    color:var(--text);
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand-mark{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,var(--sun-1),var(--sun-2) 65%,var(--sun-3));
    box-shadow:0 5px 14px rgba(196,83,10,.35);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  }
  .brand-name{font-weight:700;font-size:14.5px;}
  .brand-sub{font-size:11px;color:var(--text-muted);}
  .card{
    background:#FFFCF5;border:1px solid #F0E4CC;border-radius:16px;padding:20px;
    box-shadow:var(--shadow-card);margin-bottom:16px;
  }
  .hint{font-size:12px;color:var(--text-muted);line-height:1.7;padding:12px 14px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;}
  .info-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;}
  .info-label{color:var(--text-muted);width:64px;flex-shrink:0;}
  .pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#E8EEFF;color:#1E46C4;}
  label{font-size:12.5px;font-weight:600;display:block;margin:14px 0 6px;}
  select, input[type="text"], input[type="date"], textarea{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;
    font-size:15px;font-family:inherit;color:var(--text);background:var(--surface);
  }
  textarea{resize:vertical;}
  .date-options{display:flex;flex-wrap:wrap;gap:8px;}
  .date-btn{
    padding:10px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);
    font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
  }
  .date-btn.active{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .btn-submit{
    width:100%;margin-top:20px;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-submit:disabled{opacity:.6;cursor:not-allowed;}
  .error-box{display:none;background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-top:14px;line-height:1.6;}
  .success-box{text-align:center;padding:30px 10px;}
  .success-icon{font-size:48px;margin-bottom:10px;}
  .success-title{font-size:17px;font-weight:700;margin-bottom:6px;}
  .success-detail{font-size:13.5px;color:var(--text-muted);line-height:1.8;}
  .loading, .not-found{text-align:center;color:var(--text-muted);font-size:13px;padding:40px 10px;}
  select option:disabled{background:#E9E9EC;color:#9AA0AA;}
  .deadline-bar{display:none;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#FFF4DC;border:1px solid #F3DDA8;color:#8A5A12;font-size:13.5px;font-weight:700;line-height:1.6;}
  .deadline-bar.soon{background:#FDECEC;border-color:#F5C2C2;color:#B42318;}
  .deadline-bar small{display:block;font-weight:500;font-size:12px;opacity:.85;}
  .alt-toggle{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;line-height:1.5;background:#FFF4DC;border:1px solid #F3DDA8;border-radius:12px;padding:12px 14px;margin:6px 0 4px;cursor:pointer;}
  .alt-toggle input{margin-top:3px;flex-shrink:0;}
  .alt-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;}
  .alt-row .alt-date{flex:1 1 100%;width:100%;}
  .alt-row select{flex:1 1 0;min-width:0;}
  .alt-del{flex:0 0 auto;border:none;background:#F1F3F8;color:#6B7280;border-radius:10px;width:38px;height:38px;font-size:15px;cursor:pointer;}
  .btn-line{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:#06C755;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-ghost-lg{width:100%;margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
  .slot-list{margin:10px 0;padding:0;list-style:none;}
  .slot-list li{padding:9px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;}
  .chosen-box{text-align:center;padding:16px 10px;margin:10px 0 6px;background:linear-gradient(135deg,#FFF4DC,#FFE8BD);border-radius:14px;font-size:20px;font-weight:800;color:var(--sun-3);line-height:1.5;}
  .tut-link{margin-left:auto;border:1px solid #F0E4CC;background:#FFFCF5;color:var(--sun-3);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  #tutorialOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:14px;}
  .tut-card{position:relative;background:#fff;border-radius:20px;padding:20px 18px 16px;max-width:400px;width:100%;max-height:96vh;overflow-y:auto;box-shadow:0 14px 50px rgba(0,0,0,.35);}
  .tut-x{position:absolute;top:10px;right:12px;border:none;background:#F1F3F8;color:#6B7280;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;}
  .tut-step{font-size:11.5px;color:var(--text-muted);font-weight:700;}
  .tut-title{font-size:17px;font-weight:800;margin:2px 36px 10px 0;}
  .tut-svg{width:100%;height:auto;display:block;background:#FBF6EA;border-radius:14px;}
  .tut-text{font-size:13.5px;line-height:1.75;color:var(--text);margin:12px 2px 6px;}
  .tut-dots{display:flex;justify-content:center;gap:6px;margin:10px 0;}
  .tut-dots span{width:7px;height:7px;border-radius:50%;background:#E4E8F1;}
  .tut-dots span.on{background:var(--sun-2);width:18px;border-radius:4px;}
  .tut-btns{display:flex;gap:10px;}
  .tut-b{flex:1;padding:12px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);}
  .tut-b.ghost{background:#fff;color:var(--text);}
  .tut-b.ghost:disabled{opacity:.4;cursor:default;}
  .tut-b.main{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .busy-hint{display:none;font-size:12px;line-height:1.7;color:#8A5A12;background:#FFF4DC;border-radius:10px;padding:8px 12px;margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">陽</div>
    <div>
      <div class="brand-name">陽光管理主控台</div>
      <div class="brand-sub">現場時段預約</div>
    </div>
    <button type="button" class="tut-link" id="tutLink" style="display:none;" onclick="showTutorial()">❓ 使用教學</button>
  </div>
  <div id="lineBindBox"></div>
  <div id="app"><div class="loading">載入中…</div></div>
</div>

<script src="book-tutorial.js?v=1"></script>
<script>
const API_BASE = 'https://epc-backend-4aj2.onrender.com';
let params = new URLSearchParams(window.location.search);
// 從 LIFF 連結（https://liff.line.me/<id>?token=xxx）進來時，LINE 會把原本的 query 暫存在
// liff.state（例如 "?token=xxx" 或 "/?token=xxx"），所以 token 也要從那裡找。
function readToken(){
  const direct = params.get('token');
  if(direct) return direct;
  const st = params.get('liff.state') || '';
  const qi = st.indexOf('?');
  if(qi >= 0) return new URLSearchParams(st.slice(qi)).get('token') || '';
  return '';
}
let TOKEN = readToken();

const TIME_OPTIONS = (() => {
  const list = [];
  for(let h = 7; h <= 20; h++){
    for(const m of [0, 30]){
      if(h === 20 && m === 30) continue;
      list.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
    }
  }
  return list;
})();
function timeOptionsHtml(){
  return '<option value="">請選擇</option>' + TIME_OPTIONS.map(t => `<option value="${t}">${t}</option>`).join('');
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${m}/${d}`;
}
function fmtWeekday(iso){
  const wdays = ['日','一','二','三','四','五','六'];
  const d = new Date(iso + 'T00:00:00');
  return '週' + wdays[d.getDay()];
}

let TASK = null;
let selectedDate = '';
let forceForm = false; // true：即使任務已經有備選時段/選定時段，也顯示填寫表單（業務按「修改」或「屋主還是不行」）
let altMode = false;   // true：正在填「提供其他時間」而不是直接預約候選日期

// ---- LINE 提醒綁定（LIFF）：業務按一次「綁定」，之後回覆期限前會收到 LINE 提醒 ----
let LINE_BOUND = false;
let LINE_FRIEND = null;   // null：還不知道（沒登入取不到）、true：已是好友、false：確定還沒加陽光機器人好友
let ADD_FRIEND_URL = '';
// 進頁面跳出的提醒視窗：mode 'bind'＝還沒綁定（引導先加好友再綁定）、'friend'＝已綁定但還沒加好友
function showLineModal(mode){
  if(document.getElementById('tutorialOverlay')){ window._pendingLineModal = mode; return; }
  closeLineModal();
  const friendBtn = (ADD_FRIEND_URL && LINE_FRIEND !== true)
    ? `<a href="${ADD_FRIEND_URL}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:#06c755;color:#fff;font-weight:700;margin-top:10px;">➕ 加入陽光機器人好友</a>`
    : '';
  const bindBtn = mode === 'bind'
    ? `<button type="button" onclick="closeLineModal();startLineBind()" style="width:100%;padding:12px;border-radius:10px;border:0;background:linear-gradient(135deg,#ffb347,#f7931e);color:#fff;font-weight:700;font-size:15px;margin-top:10px;">② 綁定 LINE 提醒</button>`
    : '';
  const title = mode === 'bind' ? '🔔 想在期限前收到 LINE 提醒嗎？' : '⚠️ 你還沒加陽光機器人為好友';
  const sub = mode === 'bind'
    ? '請先加入「陽光機器人」好友，再按綁定，回覆期限前 1 小時系統會私訊提醒你。'
    : '加入好友後才收得到期限提醒。';
  const ov = document.createElement('div');
  ov.id = 'lineModalOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML = `<div style="background:#fff;color:#222;border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);">
    <div style="font-size:17px;font-weight:700;">${title}</div>
    <div style="font-size:13px;color:#666;margin-top:6px;line-height:1.6;">${sub}</div>
    ${mode === 'bind' && friendBtn ? '<div style="font-size:12px;color:#888;margin-top:12px;">① 先加好友</div>' : ''}
    ${friendBtn}${bindBtn}
    <button type="button" onclick="closeLineModal()" style="width:100%;padding:10px;border:0;background:none;color:#888;margin-top:6px;">稍後再說</button>
  </div>`;
  document.body.appendChild(ov);
}
function closeLineModal(){
  const ov = document.getElementById('lineModalOverlay');
  if(ov) ov.remove();
}
function loadLiffSdk(){
  return new Promise((resolve, reject) => {
    if(window.liff) return resolve();
    const sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    sc.onload = resolve; sc.onerror = () => reject(new Error('LIFF 載入失敗'));
    document.head.appendChild(sc);
  });
}
function renderLineBind(msg){
  const box = document.getElementById('lineBindBox');
  if(!box) return;
  if(LINE_BOUND){
    box.innerHTML = `<div class="card" style="padding:12px 16px;font-size:13px;">✅ 已綁定 LINE 提醒，期限前會自動通知你${msg?('<br><span style="color:var(--text-muted);">'+msg+'</span>'):''}${LINE_FRIEND !== false ? (LINE_FRIEND === null ? '<br><span style="color:var(--text-muted);font-size:12px;">請確認有加「陽光機器人」為好友，否則收不到</span>' : '') : ('<div style="margin-top:8px;color:#c0392b;">⚠️ 你還沒加「陽光機器人」為好友，加了才收得到提醒</div>' + (ADD_FRIEND_URL ? `<a class="btn-ghost-lg" style="display:block;text-align:center;text-decoration:none;margin-top:6px;" href="${ADD_FRIEND_URL}">➕ 加入陽光機器人好友</a>` : ''))}</div>`;
  }else{
    box.innerHTML = `<div class="card" style="padding:12px 16px;font-size:13px;">🔔 要在回覆期限前收到 LINE 提醒嗎？<br>
      <button type="button" class="btn-ghost-lg" style="margin-top:8px;" onclick="startLineBind()">綁定 LINE 提醒</button>
      ${msg?('<div style="color:#c0392b;margin-top:6px;">'+msg+'</div>'):''}</div>`;
  }
}
async function setupLineBind(data){
  if(!data.liff_id || !TASK.assignee || TASK.status === '已完成') return;
  LINE_BOUND = !!data.line_bound;
  ADD_FRIEND_URL = data.add_friend_url || '';
  renderLineBind();
  try{
    await loadLiffSdk();
    await ensureLiff(data.liff_id);
    let pending = false;
    try{ pending = sessionStorage.getItem('lineBindPending') === '1'; }catch(e){}
    if(pending && liff.isLoggedIn()){ await doLineBind(); return; }
    await checkFriendship();
    if(!LINE_BOUND) showLineModal('bind');
    else if(LINE_FRIEND === false) showLineModal('friend');
  }catch(err){
    console.warn('LIFF init 失敗', err);
  }
}
async function checkFriendship(skipRender){
  try{
    if(!window.liff || !liff.isLoggedIn()) return;
    const fr = await liff.getFriendship();
    LINE_FRIEND = !!fr.friendFlag;
    if(!skipRender) renderLineBind();
  }catch(e){ /* 沒有連結官方帳號時取不到，維持預設提示 */ }
}
async function startLineBind(){
  try{ sessionStorage.setItem('lineBindPending', '1'); }catch(e){}
  try{
    if(!window.liff || !liff.id){ renderLineBind('LINE 功能尚未準備好，請稍後再試'); return; }
    if(!liff.isLoggedIn()){ liff.login({redirectUri: window.location.href}); return; }
    await doLineBind();
  }catch(err){ renderLineBind('綁定失敗：' + err.message); }
}
async function doLineBind(){
  try{ sessionStorage.removeItem('lineBindPending'); }catch(e){}
  const res = await fetch(API_BASE + '/api/vendor-slots/public-task/' + encodeURIComponent(TOKEN) + '/bind-line', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({access_token: liff.getAccessToken()}),
  });
  const d = await res.json().catch(()=>({}));
  if(!res.ok){ renderLineBind(d.error || '綁定失敗'); return; }
  LINE_BOUND = true;
  await checkFriendship(true);
  renderLineBind(d.display_name ? ('LINE 名稱：' + d.display_name) : '');
  if(LINE_FRIEND === false) showLineModal('friend');
}

// LIFF 只初始化一次（重複 init 會出錯），所有地方都走這個
let _liffInitPromise = null;
function ensureLiff(liffId){
  if(!_liffInitPromise) _liffInitPromise = loadLiffSdk().then(() => liff.init({liffId}));
  return _liffInitPromise;
}
// 2026-10-05：第一次用 LINE 登入開 LIFF 連結時，網址會先經過一次登入轉址，這時候
// 網址上還讀不到 token / bind（要等 liff.init 處理完才會被還原成原本的 query），
// 所以讀不到就先 init LIFF，再重新讀一次網址。
async function recoverParamsViaLiff(){
  try{
    const cfg = await (await fetch(API_BASE + '/api/line/liff-config', {cache:'no-store'})).json();
    if(!cfg.liff_id) return;
    await ensureLiff(cfg.liff_id);
    params = new URLSearchParams(window.location.search);
    TOKEN = readToken();
  }catch(err){ console.warn('LIFF 還原網址失敗', err); }
}

// ---- 安排人員綁定頁：book.html?bind=scheduler（或 LIFF 連結帶 ?bind=scheduler）----
function readParam(name){
  const direct = params.get(name);
  if(direct) return direct;
  const st = params.get('liff.state') || '';
  const qi = st.indexOf('?');
  return qi >= 0 ? (new URLSearchParams(st.slice(qi)).get(name) || '') : '';
}
let SCHED_LIFF_ID = '';
function renderSchedulerBind(msg, ok){
  const app = document.getElementById('app');
  let saved = '';
  try{ saved = localStorage.getItem('schedulerBindName') || ''; }catch(e){}
  const friendBlock = (ok && LINE_FRIEND === false)
    ? ('<div style="margin-top:10px;color:#c0392b;">⚠️ 你還沒加「陽光機器人」為好友，加了才收得到通知</div>' + (ADD_FRIEND_URL ? `<a class="btn-ghost-lg" style="display:block;text-align:center;text-decoration:none;margin-top:6px;" href="${ADD_FRIEND_URL}">➕ 加入陽光機器人好友</a>` : ''))
    : '';
  app.innerHTML = ok
    ? `<div class="card"><h1>✅ 綁定完成</h1><div class="sub">${msg}<br>之後業務完成安排、回傳其他時間、或期限快到還沒安排時，陽光機器人會傳 LINE 通知你。</div>${friendBlock}</div>`
    : `<div class="card"><h1>🔔 安排人員 LINE 通知綁定</h1>
        <div class="sub">輸入你的名字（要跟主控台「安排人員」下拉選到的名字一致），再用 LINE 登入綁定。</div>
        <label>你的名字</label>
        <input type="text" id="schedName" value="${saved}" placeholder="例如：小夫" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;">
        <button type="button" class="btn-ghost-lg" style="margin-top:12px;" onclick="startSchedulerBind()">綁定 LINE 通知</button>
        ${msg ? `<div style="color:#c0392b;margin-top:8px;">${msg}</div>` : ''}</div>`;
}
async function initSchedulerBind(){
  renderSchedulerBind('');
  try{
    const cfg = await (await fetch(API_BASE + '/api/line/liff-config', {cache:'no-store'})).json();
    SCHED_LIFF_ID = cfg.liff_id || '';
    ADD_FRIEND_URL = cfg.add_friend_url || '';
    if(!SCHED_LIFF_ID){ renderSchedulerBind('LINE 功能尚未設定，請聯絡管理者'); return; }
    await loadLiffSdk();
    await ensureLiff(SCHED_LIFF_ID);
    let pending = false, name = '';
    try{ pending = sessionStorage.getItem('schedBindPending') === '1'; name = localStorage.getItem('schedulerBindName') || ''; }catch(e){}
    if(pending && name && liff.isLoggedIn()) await doSchedulerBind(name);
  }catch(err){ renderSchedulerBind('載入失敗：' + err.message); }
}
async function startSchedulerBind(){
  const name = (document.getElementById('schedName').value || '').trim();
  if(!name){ renderSchedulerBind('請先輸入名字'); return; }
  try{ localStorage.setItem('schedulerBindName', name); sessionStorage.setItem('schedBindPending', '1'); }catch(e){}
  try{
    if(!window.liff || !liff.id){ renderSchedulerBind('LINE 功能尚未準備好，請稍後再試'); return; }
    if(!liff.isLoggedIn()){ liff.login({redirectUri: window.location.href}); return; }
    await doSchedulerBind(name);
  }catch(err){ renderSchedulerBind('綁定失敗：' + err.message); }
}
async function doSchedulerBind(name){
  try{ sessionStorage.removeItem('schedBindPending'); }catch(e){}
  const res = await fetch(API_BASE + '/api/line/bind-scheduler', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({access_token: liff.getAccessToken(), name}),
  });
  const d = await res.json().catch(()=>({}));
  if(!res.ok){ renderSchedulerBind(d.error || '綁定失敗'); return; }
  await checkFriendship(true);
  renderSchedulerBind('名字：' + name + (d.display_name ? '　LINE：' + d.display_name : ''), true);
}

// ===== 2026-10-04：窗口設定的「請在這個時間前回覆」＋倒數 =====
let deadlineTimer = null;
function updateDeadlineBar(){
  const bar = document.getElementById('deadlineBar');
  if(!bar){ clearInterval(deadlineTimer); deadlineTimer = null; return; }
  if(!TASK.deadline){ bar.style.display = 'none'; return; }
  const due = new Date(TASK.deadline);
  if(isNaN(due)){ bar.style.display = 'none'; return; }
  const wd = ['日','一','二','三','四','五','六'][due.getDay()];
  const dueText = String(due.getMonth() + 1).padStart(2, '0') + '/' + String(due.getDate()).padStart(2, '0') + '（' + wd + '）' + String(due.getHours()).padStart(2, '0') + ':' + String(due.getMinutes()).padStart(2, '0');
  const ms = due - Date.now();
  let remain;
  if(ms <= 0){
    remain = '⚠️ 已超過期限，請盡快回覆或聯絡窗口';
  } else {
    const mins = Math.floor(ms / 60000);
    const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    remain = '還剩 ' + (d ? d + ' 天 ' : '') + ((d || h) ? h + ' 小時 ' : '') + m + ' 分鐘';
  }
  bar.className = 'deadline-bar' + ((ms <= 0 || ms < 3600000) ? ' soon' : '');
  bar.innerHTML = '⏰ 請在 ' + dueText + ' 前回覆窗口<small>' + remain + '</small>';
  bar.style.display = 'block';
}
function startDeadlineTicker(){
  if(deadlineTimer) clearInterval(deadlineTimer);
  updateDeadlineBar();
  deadlineTimer = setInterval(updateDeadlineBar, 30000);
}

function todayIso(){

function onAltToggle(){

function addAltRow(prefill){
  const row = document.createElement('div');
  row.className = 'alt-row';
  row.innerHTML = `<input type="date" class="alt-date" min="${todayIso()}" onchange="onAltRowChange(this)">
    <select class="alt-start" onchange="onAltStartChange(this)">${timeOptionsHtml()}</select>

function onAltRowChange(el){
  const row = el.closest('.alt-row');
  applyBusyToSelects(row.querySelector('.alt-start'), row.querySelector('.alt-end'), row.querySelector('.alt-date').value);
}
function onAltStartChange(el){
  const row = el.closest('.alt-row');
  const startSel = row.querySelector('.alt-start');
  const endSel = row.querySelector('.alt-end');
  const date = row.querySelector('.alt-date').value;
  applyBusyToSelects(startSel, endSel, date);
  const duration = getTaskDuration();
  if(startSel.value && duration){
    const endVal = fmtMin(toMin(startSel.value) + duration);
    const endOpt = [...endSel.options].find(o => o.value === endVal);
    if(endOpt && !endOpt.disabled) endSel.value = endVal;
  }
  applyBusyToSelects(startSel, endSel, date);
}
function collectAltSlots(){
  const slots = [];
  for(const row of document.querySelectorAll('#altRows .alt-row')){
    const date = row.querySelector('.alt-date').value;
    const start_time = row.querySelector('.alt-start').value;
    const end_time = row.querySelector('.alt-end').value;
    if(!date && !start_time && !end_time) continue; // 整列都空白就略過
    if(!date || !start_time || !end_time) return {error: '每一組都要填日期、開始時間、結束時間'};
    if(toMin(start_time) >= toMin(end_time)) return {error: '開始時間要早於結束時間'};
    slots.push({date, start_time, end_time});
  }
  if(!slots.length) return {error: '請至少填一組屋主可以配合的日期與時間'};
  return {slots};
}

// 2026-10-01 新增：各項目類型預設時間長度（分鐘），跟主控台「預約時段」
// modal 用同一套規則（掛表固定早上9點開始，其他類型只給時長，開始時間
// 預設也是9點，業務可以自己改）。開始時間空白時先補 09:00，再依時長算出
// 結束時間；業務改開始時間也會重算一次，但還是可以手動改掉。
// 2026-10-01 同日：項目類型改成可複選（任務可能同時是「植筋+放樣」），
// TASK.type 變成陣列，時長直接加總。
// 2026-10-01 再加一版：PM 在「指派給業務」建立任務時如果有給明確的預估
// 時長（勾「交由業務安排」直接填，或從完整預估時間換算），會存在
// TASK.duration_min，這裡優先用這個值；沒有的話（舊任務、或 PM 完全沒給
// 估計）才退回用項目類型算出的通用時長，確保這裡永遠有個合理預設可用。
const TYPE_DURATION_MIN = {'掛表':180,'植筋':180,'放樣':60,'場勘':60};
function getTaskDuration(){
  return TASK.duration_min || (TASK.type||[]).reduce((sum, t) => sum + (TYPE_DURATION_MIN[t] || 0), 0);
}
function applyTimeDurationDefault(){
  const duration = getTaskDuration();
  if(!duration) return;
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  if(!startSel || !endSel) return;
  if(!startSel.value){
    const def = [...startSel.options].find(o => o.value === '09:00');
    if(def && !def.disabled) startSel.value = '09:00'; else return;
  }
  const totalMin = toMin(startSel.value) + duration;
  const endVal = String(Math.floor(totalMin / 60)).padStart(2,'0') + ':' + String(totalMin % 60).padStart(2,'0');
  const endOpt = [...endSel.options].find(o => o.value === endVal);
  if(endOpt && !endOpt.disabled) endSel.value = endVal;
}

// 2026-10-03：這個廠商在選定日期「已經被預約」的時段，直接在開始/結束時間下拉
// 裡灰掉不能選（disabled），不用等按完成預約才被後端 409 擋下來。資料來自
// TASK.busy_slots（後端只給日期＋起訖時間，不帶別人的案號）。送出時後端仍
// 會再檢查一次衝突（兩個人同時開著頁面、其中一個先送出的情況還是會擋）。
function toMin(t){ const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function fmtMin(total){ return String(Math.floor(total / 60)).padStart(2,'0') + ':' + String(total % 60).padStart(2,'0'); }
function getBusyRanges(date){
  return ((TASK && TASK.busy_slots) || []).filter(b => b.date === date).map(b => [toMin(b.start_time), toMin(b.end_time)]);
}
function refreshTimeOptions(){
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  if(!startSel || !endSel) return;
  const busy = applyBusyToSelects(startSel, endSel, selectedDate);
  const hint = document.getElementById('busyHint');
  if(hint){
    if(busy.length){
      hint.textContent = '📌 這個廠商這天已經有預約：' + busy.slice().sort((a, b) => a[0] - b[0]).map(([s, e]) => fmtMin(s) + '-' + fmtMin(e)).join('、') + '（灰色的時間不能選）';
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
  }
}
// 把某一天這個廠商已被預約的時段，套到一組開始/結束時間下拉上（灰掉不能選）。
// 主表單跟「提供其他時間」的每一列都共用這支。回傳那天的 busy 區間。
function applyBusyToSelects(startSel, endSel, date){
  const busy = date ? getBusyRanges(date) : [];
  const startMin = startSel.value ? toMin(startSel.value) : null;
  [...startSel.options].forEach(o => {
    if(!o.value) return;
    const m = toMin(o.value);
    const blocked = busy.some(([s, e]) => m >= s && m < e);
    o.disabled = blocked;
    o.textContent = blocked ? o.value + '　已被預約' : o.value;
  });
  [...endSel.options].forEach(o => {
    if(!o.value) return;
    const m = toMin(o.value);
    const beforeStart = startMin !== null && m <= startMin;
    const overlaps = startMin !== null
      ? busy.some(([s, e]) => s < m && startMin < e)
      : busy.some(([s, e]) => m > s && m <= e);
    o.disabled = beforeStart || overlaps;
    o.textContent = (overlaps && !beforeStart) ? o.value + '　已被預約' : o.value;
  });
  [startSel, endSel].forEach(sel => {
    if(sel.value && sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = '';
  });
  return busy;
}
function onStartTimeChange(){
  refreshTimeOptions();
  applyTimeDurationDefault();
  refreshTimeOptions();
}

function selectDate(d){
  selectedDate = d;
  document.querySelectorAll('.date-btn').forEach(b => b.classList.toggle('active', b.dataset.date === d));
  // 換日期後，如果目前的開始時間（預設 09:00）剛好落在這天已被預約的時段、或
  // 預估時長排下去會撞到，就自動換成這天第一個排得下的開始時間。
  const startSel = document.getElementById('startTime');
  const endSel = document.getElementById('endTime');
  const busy = getBusyRanges(d);
  const duration = getTaskDuration() || 30;
  const fits = s => s + duration <= 20 * 60 && !busy.some(([bs, be]) => s < be && bs < s + duration);
  const cur = startSel.value ? toMin(startSel.value) : null;
  if(cur === null || !fits(cur)){
    // 優先挑 09:00 以後（預設開始時間是 09:00，不要跳到一大早 07:00），
    // 09:00 以後都排不下才退回找更早的。
    const cand = TIME_OPTIONS.find(t => toMin(t) >= 9 * 60 && fits(toMin(t))) || TIME_OPTIONS.find(t => fits(toMin(t)));
    startSel.value = cand || '';
    endSel.value = '';
  }
  refreshTimeOptions();
  applyTimeDurationDefault();
  refreshTimeOptions();
}

function onSameAsContractChange(){
  if(!document.getElementById('sameAsContract').checked) return;
  document.getElementById('ownerName').value = TASK.owner_name || '';
  document.getElementById('ownerPhone').value = TASK.owner_phone || '';
}

async function submitBooking(){
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  const start_time = document.getElementById('startTime').value;
  const end_time = document.getElementById('endTime').value;
  const registrant = document.getElementById('registrant').value.trim();
  const owner_name = document.getElementById('ownerName').value.trim();
  const owner_phone = document.getElementById('ownerPhone').value.trim();
  const note = document.getElementById('note').value.trim();
  if(!selectedDate){ alert('請先選一個候選日期'); return; }
  if(!start_time || !end_time){ alert('請選開始/結束時間'); return; }
  if(!registrant){ alert('請填您的姓名'); return; }

  const btn = document.getElementById('submitBtn');
  const originalText = btn.textContent;
  btn.textContent = '送出中…'; btn.disabled = true;
  try{
    const res = await fetch(API_BASE + '/api/vendor-slots/public-task/' + encodeURIComponent(TOKEN) + '/book', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({date: selectedDate, start_time, end_time, registrant, note, owner_name, owner_phone}),
    });
    const data = await res.json().catch(()=>({}));
    if(res.status === 409 && data.conflict){
      const c = data.conflict;
      errorBox.innerHTML = `⚠️ 這個時段已經被佔用了：<b>${c.start_time}-${c.end_time}</b>　${(c.type||[]).join('+')}｜${c.case||''}${c.alias?('（'+c.alias+'）'):''}　登記人：${c.registrant||''}<br>請換一個時間再試一次。`;
      errorBox.style.display = 'block';
      // 頁面開著的期間別人剛好先預約了：把這段加進已被預約清單，下拉立刻灰掉
      TASK.busy_slots = (TASK.busy_slots || []).concat([{date: selectedDate, start_time: c.start_time, end_time: c.end_time}]);
      refreshTimeOptions();
      return;
    }
    if(!res.ok){
      errorBox.textContent = '⚠️ ' + (data.error || ('HTTP ' + res.status));
      errorBox.style.display = 'block';
      return;
    }
    TASK.status = '已完成';
    TASK.booked = {date: selectedDate, start_time, end_time, registrant};
    render();
  }catch(err){
    errorBox.textContent = '⚠️ 送出失敗：' + err.message;
    errorBox.style.display = 'block';
  }finally{
    btn.textContent = originalText; btn.disabled = false;
  }
}

init();
