<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 廠商預約頁（2026-10-19）。陽光伏特家給每家廠商一條專屬連結 vendor.html?v=廠商Token：
     廠商只看得到、也只能為「自己廠商的案件」提出預約申請（場勘／放樣／植筋／進場／掛表），申請進主控台由窗口處理。
     連結本身就是身分驗證，請勿轉傳給其他廠商。 -->
<title>陽光伏特家｜廠商預約</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F2790C">
<style>
  :root{
    --bg:#F7F3EC; --surface:#FFFFFF; --text:#1B2333; --text-muted:#6B7280;
    --border:#E4E8F1; --success:#16A34A; --danger:#D64545; --danger-soft:#FDECEC;
    --sun-1:#FFB648; --sun-2:#F2790C; --sun-3:#C4530A;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:radial-gradient(ellipse 900px 500px at 100% 0%, rgba(255,182,72,.18), transparent 60%), var(--bg);color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 70px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .alertbar{background:#FFF4DC;border:1.5px solid #F2C46B;color:#9A5B00;border-radius:14px;padding:11px 14px;font-size:14.5px;font-weight:700;margin-bottom:12px;cursor:pointer;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-head b{font-size:17px;} .cal-nav{border:1.5px solid var(--border);background:#fff;border-radius:10px;width:38px;height:36px;font-size:18px;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--text-muted);padding:2px 0;font-weight:700;}
  .cal-day{min-height:58px;border:1.5px solid #F0E4CC;border-radius:10px;background:#fff;padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,border-color .15s;}
  .cal-day.out{opacity:.35;} .cal-day.today{border-color:var(--sun-2);} .cal-day.sel{background:#FFF1DC;border-color:var(--sun-2);box-shadow:0 0 0 2px rgba(242,121,12,.18);}
  .cal-day .n{font-size:13.5px;font-weight:700;} .cal-day.today .n{color:var(--sun-3);}
  .cal-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}
  .dot{width:9px;height:9px;border-radius:50%;} .dot.ok{background:#22A559;} .dot.wait{background:#F2A30C;} .dot.issue{background:#E5484D;}
  .cal-more{font-size:10.5px;color:var(--text-muted);font-weight:700;line-height:1;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted);margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .bk{border:1.5px solid #F0E4CC;background:#fff;border-radius:14px;padding:12px 13px;margin-top:10px;}
  .bk.focus{border-color:var(--sun-2);box-shadow:0 0 0 3px rgba(242,121,12,.2);}
  .bk .row2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .sc{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap;}
  .sc-ok{background:#DCFCE7;color:#15803D;} .sc-wait{background:#FFF1DC;color:#B45309;} .sc-issue{background:#FDECEC;color:#B42318;}
  .kv{font-size:13.5px;line-height:1.75;margin-top:6px;} .kv .k{color:var(--text-muted);}
  .bk-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn-sm{padding:11px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .btn-sm:disabled{opacity:.6;}
  .issue-txt{margin-top:8px;background:#FDECEC;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;white-space:pre-wrap;color:#8A1F1F;}
  .seg{display:flex;gap:6px;margin:2px 0 10px;background:#F1ECE0;border-radius:12px;padding:4px;}
  .seg-b{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--text-muted);transition:background .2s,color .2s;}
  .seg-b.on{background:#fff;color:var(--sun-3);box-shadow:0 1px 5px rgba(120,80,20,.15);}
  .wdrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 4px;}
  .wd{padding:11px 0;border-radius:11px;border:2px solid var(--border);background:#fff;font-size:15px;font-weight:700;text-align:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .wd.ok{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .wd.no{background:#FDECEC;color:#B42318;border-color:#F3C5C5;text-decoration:line-through;}
  .sub{font-size:13px;color:var(--text-muted);margin:10px 0 2px;}
  .linkbtn{background:none;border:none;color:var(--sun-3);font-size:13.5px;font-weight:700;padding:8px 0 0;cursor:pointer;text-decoration:underline;}
  .ct-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #F0E4CC;font-size:14.5px;}
  .ct-row button{border:none;background:#F1F3F8;border-radius:50%;width:30px;height:30px;cursor:pointer;flex:0 0 30px;}
  .sbar{display:flex;gap:7px;overflow-x:auto;margin:12px -4px 2px;padding:2px 4px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .sbar::-webkit-scrollbar{display:none;}
  .sb{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s;}
  .sb:active{transform:scale(.96);}
  .sb .n{margin-left:5px;font-size:12px;font-weight:800;color:var(--sun-3);}
  .sb.zero{opacity:.55;}
  .sb.on{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .sb.on .n{color:#fff;}
  .searchbox{position:relative;margin-top:12px;}
  .searchbox input{padding-left:40px;}
  .searchbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;opacity:.7;}
  .searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:50%;background:#F1F3F8;font-size:14px;cursor:pointer;display:none;}
  .stage-head{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding-top:12px;border-top:1px dashed #EBD8B0;font-size:15px;}
  .stage-n{font-size:12px;color:#B45309;background:#FFF1D6;border-radius:999px;padding:1px 9px;font-weight:600;}
  .brand-logo{width:40px;height:40px;border-radius:12px;box-shadow:0 5px 14px rgba(196,83,10,.3);flex-shrink:0;}
  .brand-mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(150deg,var(--sun-1),var(--sun-2) 65%,var(--sun-3));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 5px 14px rgba(196,83,10,.3);}
  .brand-name{font-weight:800;font-size:17px;}
  .brand-sub{font-size:12.5px;color:var(--text-muted);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:11px 6px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:14.5px;font-weight:700;cursor:pointer;}
  .tab.active{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .card{background:#FFFCF5;border:1px solid #F0E4CC;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,40,70,.06);}
  h2{font-size:17px;margin:0 0 6px;}
  .muted{color:var(--text-muted);font-size:13.5px;line-height:1.7;}
  label{display:block;font-size:14.5px;font-weight:700;margin:14px 0 6px;}
  input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);}
  textarea{resize:vertical;min-height:70px;}
  .btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;font-size:17px;font-weight:800;cursor:pointer;}
  .btn:disabled{opacity:.6;}
  .btn-ghost{padding:9px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;}
  .btn-danger{color:var(--danger);border-color:#F3C5C5;}
  .case{border:1.5px solid var(--border);background:#fff;border-radius:14px;padding:12px 13px;margin-top:10px;cursor:pointer;}
  .case:hover{border-color:var(--sun-2);}
  .case b{font-size:15.5px;} .case .addr{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#FFF1DC;color:var(--sun-3);margin:6px 6px 0 0;}
  .chip.wait{background:#EEE8FF;color:#6D28D9;}
  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .type{padding:11px 4px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:15px;font-weight:700;text-align:center;cursor:pointer;}
  .type.on{background:linear-gradient(135deg,var(--sun-1),var(--sun-2));color:#fff;border-color:transparent;}
  .date-row{display:flex;gap:8px;margin-bottom:8px;}
  .date-row input{flex:1;}
  .date-row button{flex:0 0 46px;border:none;border-radius:12px;background:#F1F3F8;font-size:16px;cursor:pointer;}
  .err{display:none;background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.6;}
  .ok-box{text-align:center;padding:24px 6px;}
  .ok-icon{font-size:52px;}
  .st{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;}
  .st-待處理{background:#FFF1DC;color:#B45309;} .st-已轉任務{background:#DCFCE7;color:#15803D;}
  .st-已退回{background:#FDECEC;color:#B42318;} .st-已取消{background:#EEE;color:#6B7280;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .reply{margin-top:8px;background:#F3F6FF;border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.6;}
  .day{font-weight:800;margin:16px 0 6px;font-size:15px;}
  .loading{text-align:center;color:var(--text-muted);padding:50px 10px;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="brand-logo" src="logo.svg" alt="陽光伏特家" width="40" height="40">
    <div><div class="brand-name">陽光伏特家｜廠商預約</div><div class="brand-sub" id="vendorName">&nbsp;</div></div>
  </div>
  <div id="app"><div class="loading">載入中…</div></div>
</div>

<script>
const API_BASE = 'https://epc-backend-4aj2.onrender.com';
const V = new URLSearchParams(location.search).get('v') || '';
const WD = ['日', '一', '二', '三', '四', '五', '六'];
let D = null;                 // {vendor, types, suggestions, requests, bookings}
let tab = 'new';
let picked = null;            // 選好的案件 {case, alias, address, types}
let selTypes = new Set();
let searchTimer = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dayLabel(iso){ const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : `${d.getMonth() + 1}/${d.getDate()}（週${WD[d.getDay()]}）`; }
function todayIso(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

async function api(path, opt){
  const res = await fetch(API_BASE + '/api/vendor-portal/' + encodeURIComponent(V) + path, Object.assign({cache: 'no-store'}, opt || {}));
  const data = await res.json().catch(() => ({}));
  if(!res.ok){ const e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; throw e; }
  return data;
}

async function init(){
  const app = document.getElementById('app');
  if(!V){ app.innerHTML = '<div class="card">連結不完整，請向陽光伏特家窗口索取您的專屬預約連結。</div>'; return; }
  try{
    D = await api('/info');
  }catch(e){
    app.innerHTML = `<div class="card">${esc(e.message)}</div>`;
    return;
  }
  document.getElementById('vendorName').textContent = D.vendor;
  const bid = new URLSearchParams(location.search).get('b');
  if(bid){
    const b = (D.bookings || []).find(x => x.id === bid);
    if(b){ tab = 'booked'; calSel = b.date; calMonth = b.date.slice(0, 7); openB = bid; }
    else { tab = 'booked'; deepMissing = true; }
  }
  if(new URLSearchParams(location.search).get('tab') === 'booked') tab = 'booked';   // 「行程日曆連結」：直接開到行程日曆
  render();
}

// 行程依項目上色（跟陽光主控台的廠商日曆同一組顏色）
const TYPE_COLORS = {'場勘': ['#DBEAFE', '#1D4ED8'], '放樣': ['#CCFBF1', '#0F766E'], '植筋': ['#EDE9FE', '#6D28D9'], '進場': ['#FFEDD5', '#C2410C'], '掛表': ['#DCFCE7', '#15803D']};
function typeColor(types){ const t = (types || []).find(x => TYPE_COLORS[x]); return TYPE_COLORS[t] || ['#F1F5F9', '#475569']; }
function typeChips(types){ return (types || []).map(t => { const c = TYPE_COLORS[t] || ['#F1F5F9', '#475569']; return `<span class="chip" style="margin-top:0;background:${c[0]};color:${c[1]};">${esc(t)}</span>`; }).join(''); }

function render(){
  const waiting = D.requests.filter(r => r.status === '待處理').length;
  const app = document.getElementById('app');
  app.innerHTML = `<div class="tabs">
      <div class="tab ${tab === 'new' ? 'active' : ''}" onclick="setTab('new')">＋ 提出預約</div>
      <div class="tab ${tab === 'mine' ? 'active' : ''}" onclick="setTab('mine')">我的申請${D.requests.length ? '（' + D.requests.length + '）' : ''}</div>
      <div class="tab ${tab === 'booked' ? 'active' : ''}" onclick="setTab('booked')">📅 行程日曆${unackedUpcoming().length ? ' <span style="background:#E5484D;color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;">' + unackedUpcoming().length + '</span>' : ''}</div>
    </div>${tab !== 'booked' && unackedUpcoming().length ? `<div class="alertbar" onclick="setTab('booked')">⏳ 有 ${unackedUpcoming().length} 筆行程等您確認 ➜ 點這裡查看</div>` : ''}<div id="pane"></div>`;
  if(tab === 'new') renderNew();
  else if(tab === 'mine') renderMine();
  else renderBooked();
}
function setTab(t){ tab = t; if(t === 'new' && !picked) {} render(); }

// ---------- 提出預約 ----------
function caseCard(c, fn){
  return `<div class="case" onclick="${fn}">
      <b>${esc(c.case)}</b> <span class="muted">${esc(c.alias || '')}</span>
      ${c.address ? `<div class="addr">📍 ${esc(c.address)}</div>` : ''}
      ${(c.types || []).map(t => `<span class="chip ${(c.pending || []).includes(t) ? 'wait' : ''}">${esc(t)}${(c.pending || []).includes(t) ? '（已申請，待回覆）' : '（可預約）'}</span>`).join('')}
    </div>`;
}
const STAGE_HINT = {'場勘': '還沒送併聯審查，可以預約場勘', '放樣': '已取得併聯審查，可以預約放樣', '進場': '已取得同意備案，可以預約進場（也可預約放樣）', '掛表': '已進場施工完成、還沒掛表，可以預約掛表'};
let searchQ = '', stageSel = '全部', otherRes = [];

// 比對用：全形轉半形、轉小寫、去空白；多個關鍵字（空白分開）要全部符合
function normQ(t){ return String(t || '').normalize('NFKC').toLowerCase(); }
function matchCase(c, q){
  const toks = normQ(q).split(/\s+/).filter(Boolean);
  if(!toks.length) return true;
  const hay = normQ([c.case, c.alias, c.address].join(' '));
  return toks.every(t => hay.includes(t));
}
function stagesList(){ return D.stages || ['場勘', '放樣', '進場', '掛表']; }

function renderNew(){
  const pane = document.getElementById('pane');
  if(picked){ renderForm(pane); return; }
  pane.innerHTML = `<div class="card">
      <h2>① 選擇要預約的案件</h2>
      <div class="muted">只會顯示${esc(D.vendor)}的案件。</div>
      <div class="searchbox"><span class="ic">🔍</span>
        <input id="q" type="search" autocomplete="off" placeholder="搜尋案號、別名、地址（例：工程桃園）" value="${esc(searchQ)}" oninput="onSearch(this.value)">
        <button class="clr" id="qclr" onclick="clearSearch()" aria-label="清除">✕</button></div>
      <div class="sbar" id="sbar"></div>
      <div id="sugList"></div>
      <div id="qres"></div>
    </div>`;
  updateList();
  if(searchQ.trim()) runServerSearch(searchQ);
}
// 只重畫「階段條＋清單」，輸入框不動（打字才不會失去焦點）
function updateList(){
  const sug = D.suggestions || [];
  const q = searchQ.trim();
  const byQ = sug.filter(c => matchCase(c, q));
  const cnt = {'全部': byQ.length};
  stagesList().forEach(st => { cnt[st] = byQ.filter(c => (c.stage || '場勘') === st).length; });
  const sbar = document.getElementById('sbar');
  if(sbar) sbar.innerHTML = ['全部'].concat(stagesList()).map(st =>
    `<div class="sb ${stageSel === st ? 'on' : ''} ${cnt[st] ? '' : 'zero'}" onclick="setStage('${st}')">${st === '全部' ? '全部' : esc(st)}<span class="n">${cnt[st]}</span></div>`).join('');
  const clr = document.getElementById('qclr');
  if(clr) clr.style.display = q ? 'block' : 'none';
  const box = document.getElementById('sugList');
  if(!box) return;
  const shown = byQ.filter(c => stageSel === '全部' || (c.stage || '場勘') === stageSel);
  if(!sug.length){
    box.innerHTML = '<div class="muted" style="margin-top:10px;">目前沒有系統建議的待安排案件，請用上面搜尋。</div>';
  }else if(!shown.length){
    box.innerHTML = `<div class="muted" style="margin-top:12px;">${q ? `「${esc(q)}」` : ''}${stageSel === '全部' ? '在待安排清單裡沒有符合的案件' : `在「${esc(stageSel)}」裡沒有符合的案件`}。${q && stageSel !== '全部' ? '<a href="javascript:void(0)" onclick="setStage(\'全部\')">看全部階段</a>' : ''}</div>`;
  }else{
    box.innerHTML = stagesList().map(st => {
      if(stageSel !== '全部' && stageSel !== st) return '';
      const rows = shown.filter(c => (c.stage || '場勘') === st);
      if(!rows.length) return '';
      return `<div class="stage-head"><b>${esc(st)}</b><span class="stage-n">${rows.length} 案</span></div>
        <div class="muted" style="font-size:12px;margin:-2px 0 6px;">${esc(STAGE_HINT[st] || '')}</div>` +
        rows.map(c => caseCard(c, `pickSug(${sug.indexOf(c)})`)).join('');
    }).join('');
  }
  renderOther();
}
function setStage(st){ stageSel = st; updateList(); }
function clearSearch(){
  searchQ = ''; otherRes = [];
  const i = document.getElementById('q'); if(i){ i.value = ''; i.focus(); }
  updateList();
}
function onSearch(q){
  searchQ = q;
  clearTimeout(searchTimer);
  updateList();   // 待安排清單即時過濾
  if(!q.trim()){ otherRes = []; renderOther(); return; }
  searchTimer = setTimeout(() => runServerSearch(q), 350);
}
// 清單以外的案件（審查中、還沒到可預約階段的…）也能搜：問後端，排除清單裡已經有的
async function runServerSearch(q){
  const box = document.getElementById('qres');
  if(!box) return;
  try{
    const d = await api('/cases?q=' + encodeURIComponent(q.trim()));
    if(q !== searchQ) return;   // 又打了新的字，這次結果作廢
    const have = new Set((D.suggestions || []).map(c => c.case));
    otherRes = (d.results || []).filter(c => !have.has(c.case));
    renderOther(true);

let dateMode = 'date';
let wdOk = new Set(), wdNo = new Set();
const WD_LABEL = ['一', '二', '三', '四', '五', '六', '日'];
function setDateMode(m){
  dateMode = m;
  document.getElementById('dmDate').classList.toggle('on', m === 'date');
  document.getElementById('dmWd').classList.toggle('on', m === 'wd');
  document.getElementById('dateBox').style.display = m === 'date' ? 'block' : 'none';
  document.getElementById('wdBox').style.display = m === 'wd' ? 'block' : 'none';
}
function renderWdRows(){
  document.getElementById('wdOkRow').innerHTML = WD_LABEL.map((t, i) => `<div class="wd ${wdOk.has(i) ? 'ok' : ''}" onclick="toggleWd('ok', ${i})">${t}</div>`).join('');

}
function toggleWd(kind, i){
  const a = kind === 'ok' ? wdOk : wdNo, b = kind === 'ok' ? wdNo : wdOk;
  if(a.has(i)) a.delete(i); else { a.add(i); b.delete(i); }   // 同一天不能同時「可以」又「不行」
  renderWdRows();
}

function toggleType(t){ if(selTypes.has(t)) selTypes.delete(t); else selTypes.add(t); document.querySelectorAll('.type').forEach(el => el.classList.toggle('on', selTypes.has(el.textContent.trim()))); }

async function submitReq(){

  if(dateMode === 'wd') body.weekdays = {ok: [...wdOk].sort(), no: [...wdNo].sort(), within: +document.getElementById('wdWithin').value};
  if(!body.items.length){ err.textContent = '請至少勾選一個預約項目'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '送出中…';

    await api('/requests', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if(saveNew){ try{ await api('/contacts', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({action: 'add'}, saveNew))}); }catch(e){} }

// ---------- 行程日曆（2026-10-26）：廠商看自己的行程、按「確認收到」、回報問題；陽光窗口看到同一份資料 ----------
let calMonth = '', calSel = '', openB = '', deepMissing = false;
function bookingStatus(b){ return b.ack_at ? 'ok' : (b.issue ? 'issue' : 'wait'); }
function unackedUpcoming(){ const t = todayIso(); return ((D && D.bookings) || []).filter(b => b.date >= t && !b.ack_at); }
function fmtAck(iso){ return (iso || '').slice(5, 16).replace('T', ' ').replace('-', '/'); }
function statusChip(b){
  const st = bookingStatus(b);
  if(st === 'ok') return `<span class="sc sc-ok">✅ 已確認${b.ack_by ? '・' + esc(b.ack_by) : ''}（${esc(fmtAck(b.ack_at))}）</span>`;
  if(st === 'issue') return '<span class="sc sc-issue">⚠️ 已回報問題・等陽光窗口處理</span>';
  return '<span class="sc sc-wait">⏳ 等您確認</span>';
}
function calGo(delta){
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderBooked();
}
function calPick(d){ calSel = d; openB = ''; renderBooked(); }
function renderBooked(){
  const pane = document.getElementById('pane');
  const today = todayIso();
  const bks = D.bookings || [];
  if(!calSel){   // 預設：今天有行程就選今天，沒有就選下一個有行程的日子，再沒有就今天
    const next = bks.filter(b => b.date >= today).map(b => b.date).sort()[0];
    calSel = bks.some(b => b.date === today) ? today : (next || today);
  }
  if(!calMonth) calMonth = calSel.slice(0, 7);
  const byDay = {};
  bks.forEach(b => (byDay[b.date] ||= []).push(b));
  const [y, m] = calMonth.split('-').map(Number);
  const startDow = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i = 0; i < startDow; i++) cells += '<div></div>';
  for(let d = 1; d <= dim; d++){
    const iso = `${calMonth}-${String(d).padStart(2, '0')}`;
    const list = byDay[iso] || [];
    const ring = {ok: '', wait: 'box-shadow:0 0 0 2px #fff,0 0 0 3.5px #F2A30C;', issue: 'box-shadow:0 0 0 2px #fff,0 0 0 3.5px #E5484D;'};
    const dots = list.slice(0, 4).map(b => `<span class="dot" style="background:${typeColor(b.types)[1]};${ring[bookingStatus(b)]}"></span>`).join('');
    cells += `<div class="cal-day ${iso === today ? 'today' : ''} ${iso === calSel ? 'sel' : ''}" onclick="calPick('${iso}')"><span class="n">${d}</span>
      <div class="cal-dots">${dots}</div>${list.length > 4 ? `<span class="cal-more">+${list.length - 4}</span>` : ''}</div>`;
  }
  const dayList = (byDay[calSel] || []).slice().sort((a, b) => a.start.localeCompare(b.start));
  const upcomingList = bks.filter(b => b.date >= today);
  const upcomingCount = upcomingList.length, lastUpcoming = upcomingList.map(b => b.date).sort().pop() || '';
  const pending = unackedUpcoming();
  pane.innerHTML = `${deepMissing ? '<div class="card" style="border-color:#F3C5C5;">找不到你點的那筆行程（可能已被取消或改期），請看下面的日曆。</div>' : ''}
    ${pending.length ? `<div class="card" style="border-color:#F2C46B;background:#FFF9EC;"><h2 style="font-size:15.5px;">⏳ 等您確認的行程（${pending.length}）</h2>
      ${pending.slice(0, 8).map(b => `<div class="case" style="margin-top:8px;" onclick="calSel='${b.date}';calMonth='${b.date.slice(0, 7)}';openB='${b.id}';renderBooked()">
        <b>${esc(dayLabel(b.date))} ${esc(b.start)}</b> ${typeChips(b.types)}
        <div>${esc(b.case)} <span class="muted">${esc(b.alias || '')}</span></div></div>`).join('')}${pending.length > 8 ? `<div class="muted" style="margin-top:6px;">還有 ${pending.length - 8} 筆，請看日曆</div>` : ''}</div>` : ''}
    <div class="card">
      <div class="cal-head"><button class="cal-nav" onclick="calGo(-1)">‹</button><b>${y} 年 ${m} 月</b><button class="cal-nav" onclick="calGo(1)">›</button></div>
      <div class="cal-grid">${['日', '一', '二', '三', '四', '五', '六'].map(t => `<div class="cal-dow">${t}</div>`).join('')}${cells}</div>
      <div class="legend">${Object.keys(TYPE_COLORS).map(t => `<span><i class="dot" style="background:${TYPE_COLORS[t][1]};"></i>${t}</span>`).join('')}</div>
      <div class="legend" style="margin-top:6px;"><span><i class="dot" style="background:#94A3B8;"></i>已確認</span><span><i class="dot" style="background:#94A3B8;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #F2A30C;"></i>圓點外圈橘色＝等您確認</span><span><i class="dot" style="background:#94A3B8;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #E5484D;"></i>紅色＝已回報問題</span></div>
      ${upcomingCount ? `<div class="muted" style="margin-top:8px;font-size:13px;">📌 目前已排 <b>${upcomingCount}</b> 筆行程，最後排到 <b>${esc(dayLabel(lastUpcoming))}</b></div>` : ''}
      <div class="muted" style="margin-top:8px;font-size:12.5px;">這份日曆跟陽光窗口看到的是同一份資料；行程改日期或時間後，會需要您重新確認。</div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;">📅 ${esc(dayLabel(calSel))}${calSel === today ? '（今天）' : ''}</h2>
      <label style="margin-top:8px;">您的名字（確認、回報時留給陽光窗口看）</label>
      <input id="byName" placeholder="例如：林先生" value="${esc(lsGet('vp_by'))}" onchange="lsSet('vp_by', this.value.trim())">

    </div>`;
  if(openB){
    const el = document.getElementById('bk_' + openB);
    if(el){ el.classList.add('focus'); setTimeout(() => el.scrollIntoView({behavior: 'smooth', block: 'center'}), 80); }
  }
}
function bookingCard(b){

    <div class="row2"><div><b style="font-size:16px;">${esc(b.start)}–${esc(b.end)}</b> ${typeChips(b.types)}</div>${statusChip(b)}</div>

      ${b.address ? `<div><span class="k">地址：</span>${esc(b.address)} ${b.map ? `<a href="${esc(b.map)}" target="_blank" rel="noopener">🗺 地圖</a>` : ''}</div>` : ''}
      ${b.owner_name || b.owner_phone ? `<div><span class="k">屋主：</span>${esc(b.owner_name)} ${b.owner_phone ? `<a href="tel:${esc(b.owner_phone)}">📞 ${esc(b.owner_phone)}</a>` : ''}</div>` : ''}
      ${b.companions ? `<div><span class="k">同時施作：</span>${esc(b.companions)}</div>` : ''}
      ${b.note ? `<div><span class="k">現場備註：</span>${esc(b.note)}</div>` : ''}
      ${b.pm_note ? `<div><span class="k">陽光備註：</span>${esc(b.pm_note)}</div>` : ''}
    </div>
    ${b.issue ? `<div class="issue-txt">您回報的問題：\n${esc(b.issue)}</div>` : ''}
    ${canAct ? `<div class="bk-actions">
        ${st !== 'ok' ? `<button class="btn-sm" id="ackBtn_${esc(b.id)}" onclick="ackBooking('${esc(b.id)}')">✅ 確認收到這筆行程</button>` : ''}
        <button class="btn-ghost" onclick="toggleIssue('${esc(b.id)}')">⚠️ 回報問題</button></div>
      <div id="issueBox_${esc(b.id)}" style="display:none;margin-top:8px;">
        <textarea id="issueTxt_${esc(b.id)}" placeholder="例如：這個時間人手不夠，可以改 16:00 嗎？地址有誤？"></textarea>
        <button class="btn-sm" style="margin-top:8px;background:#E5484D;" onclick="sendIssue('${esc(b.id)}')">送出回報給陽光窗口</button></div>` : ''}
  </div>`;
}
function toggleIssue(id){ const el = document.getElementById('issueBox_' + id); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
function byName(){ const v = (document.getElementById('byName') || {}).value || ''; return v.trim(); }
async function ackBooking(id){
  const by = byName();
  if(!by && !confirm('沒有填名字，陽光窗口會看不出是誰確認的，仍要送出嗎？')) return;
  const btn = document.getElementById('ackBtn_' + id); if(btn){ btn.disabled = true; btn.textContent = '送出中…'; }
  try{
    lsSet('vp_by', by);
    await api('/bookings/' + encodeURIComponent(id) + '/ack', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({by})});
    D = await api('/info'); openB = id; render();
  }catch(e){ alert(e.message); if(btn){ btn.disabled = false; btn.textContent = '✅ 確認收到這筆行程'; } }
}
async function sendIssue(id){
  const msg = (document.getElementById('issueTxt_' + id).value || '').trim();
  if(!msg){ alert('請寫一下是什麼問題'); return; }
  try{
    lsSet('vp_by', byName());
    await api('/bookings/' + encodeURIComponent(id) + '/issue', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg, by: byName()})});
    D = await api('/info'); openB = id; render();
    alert('已送出，陽光窗口會盡快聯絡您。');
  }catch(e){ alert(e.message); }
}

init();
</script>
</body>
</html>
